<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="100%" role="img" aria-label="载荷嵌套结构">
<style>
  .t{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#24292f}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
  .sub{fill:#6b7a8f}.red{fill:#e5484d}.grn{fill:#30a46c}
  .box{fill:none;stroke:#8b96a5;stroke-width:1.5}
  .bad{fill:none;stroke:#e5484d;stroke-width:2}
  .badfill{fill:#e5484d;opacity:.06}
  .arw{stroke:#8b96a5;stroke-width:1.5;fill:none;marker-end:url(#a)}
  @media (prefers-color-scheme:dark){
    .t,.mono{fill:#e6edf3}.sub{fill:#9aa7b5}.box{stroke:#5b6673}.arw{stroke:#5b6673}
  }
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#8b96a5"/></marker></defs>

<text x="0" y="18" class="t" font-size="15" font-weight="600">载荷嵌套结构</text>

<rect x="0" y="36" width="300" height="180" class="box" rx="8"/>
<text x="14" y="58" class="t" font-size="13" font-weight="600">Installer.app</text>
<text x="14" y="76" class="sub t" font-size="11">伪装成 Parallels 官方安装器</text>
<text x="14" y="102" class="mono" font-size="11">LicenseInstaller</text><text x="200" y="102" class="sub mono" font-size="11">1.9 MB</text>
<text x="14" y="126" class="mono red" font-size="11" font-weight="600">license.cert</text><text x="200" y="126" class="sub mono" font-size="11">1.6 MB</text>
<text x="14" y="150" class="mono" font-size="11">license.db</text><text x="200" y="150" class="sub mono" font-size="11">83 KB</text>
<text x="14" y="174" class="mono" font-size="11">license.dv</text><text x="200" y="174" class="sub mono" font-size="11">313 KB</text>
<text x="14" y="198" class="sub mono" font-size="11">AppIcon / Assets / nib</text>

<path d="M308,126 L352,126" class="arw"/>
<text x="312" y="118" class="sub t" font-size="10">实为</text>

<rect x="360" y="36" width="280" height="180" class="badfill" rx="8"/>
<rect x="360" y="36" width="280" height="180" class="bad" rx="8"/>
<text x="374" y="58" class="red" font-size="13" font-weight="600">假 RIFF 头 + 加密 ZIP</text>
<text x="374" y="80" class="mono" font-size="10">52 49 46 46  4D 5A  50 4B 03 04</text>
<text x="374" y="96" class="sub mono" font-size="10">R  I  F  F   M  Z   P  K</text>
<text x="374" y="120" class="sub t" font-size="11">前 6 字节是伪造头,</text>
<text x="374" y="138" class="sub t" font-size="11">真正的 ZIP 从 offset 6 开始</text>
<text x="374" y="168" class="t" font-size="11">加密算法:ZipCrypto(老式)</text>
<text x="374" y="188" class="grn" font-size="11" font-weight="600">→ 已知明文攻击可破</text>

<path d="M648,126 L692,126" class="arw"/>

<rect x="700" y="36" width="220" height="180" class="box" rx="8"/>
<text x="714" y="58" class="t" font-size="13" font-weight="600">38 个条目</text>
<text x="714" y="82" class="mono" font-size="10">libchannel.dylib</text><text x="860" y="82" class="sub mono" font-size="10">3.0M</text>
<text x="714" y="102" class="mono" font-size="10">monitor/Parallels Certificate</text>
<text x="714" y="120" class="mono" font-size="10">monitor/*.plist</text>
<text x="714" y="140" class="mono" font-size="10">pubkey</text><text x="860" y="140" class="sub mono" font-size="10">11K</text>
<text x="714" y="162" class="mono red" font-size="10" font-weight="600">certs/ × 32</text>
<text x="714" y="180" class="sub t" font-size="10">← 不是证书,是补丁库</text>

<line x1="0" y1="242" x2="920" y2="242" stroke="#8b96a5" stroke-width="1" opacity=".4"/>
<text x="0" y="268" class="t" font-size="14" font-weight="600">落地位置(CRC32 逐一验证)</text>

<rect x="0" y="284" width="920" height="120" class="box" rx="8"/>
<text x="16" y="308" class="sub t" font-size="11">ZIP 条目</text>
<text x="330" y="308" class="sub t" font-size="11">安装到</text>
<text x="800" y="308" class="sub t" font-size="11">CRC32</text>

<text x="16" y="332" class="mono" font-size="11">libchannel.dylib</text>
<text x="330" y="332" class="mono" font-size="11">…/Parallels/channel.cert</text>
<text x="800" y="332" class="mono grn" font-size="11">✓ b37a3ae5</text>

<text x="16" y="352" class="mono" font-size="11">monitor/Parallels Certificate</text>
<text x="330" y="352" class="mono" font-size="11">…/Parallels/Parallels Certificate</text>
<text x="800" y="352" class="mono grn" font-size="11">✓ 9df09b8b</text>

<text x="16" y="372" class="mono" font-size="11">pubkey</text>
<text x="330" y="372" class="mono" font-size="11">…/Parallels/.pubkey</text>
<text x="800" y="372" class="mono grn" font-size="11">✓ 4c993864</text>

<text x="16" y="392" class="mono" font-size="11">monitor/com.parallels.certificate.plist</text>
<text x="330" y="392" class="mono" font-size="11">/Library/LaunchDaemons/</text>
<text x="800" y="392" class="mono grn" font-size="11">✓ 1626e628</text>

<text x="0" y="434" class="t" font-size="12">最后一项是 <tspan class="red" font-weight="600">root 权限的 LaunchDaemon</tspan>,RunAtLoad + KeepAlive,负责在 Parallels 升级后重新打补丁。</text>
<text x="0" y="456" class="sub t" font-size="11">原始未破解的二进制被备份在 .data/{.c,.d,.v},共 107 MB,作为差分补丁的基准。</text>
</svg>
