<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" role="img" aria-label="正版激活与破解激活对比">
<style>
  .t{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#24292f}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
  .sub{fill:#6b7a8f}.red{fill:#e5484d}.grn{fill:#30a46c}
  .box{fill:none;stroke:#8b96a5;stroke-width:1.5}
  .gbox{fill:none;stroke:#30a46c;stroke-width:1.5}
  .rbox{fill:none;stroke:#e5484d;stroke-width:1.5}
  .gfill{fill:#30a46c;opacity:.06}.rfill{fill:#e5484d;opacity:.06}
  .garw{stroke:#30a46c;stroke-width:1.5;fill:none;marker-end:url(#g)}
  .rarw{stroke:#e5484d;stroke-width:1.5;fill:none;marker-end:url(#r)}
  @media (prefers-color-scheme:dark){
    .t,.mono{fill:#e6edf3}.sub{fill:#9aa7b5}.box{stroke:#5b6673}
  }
</style>
<defs>
<marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#30a46c"/></marker>
<marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e5484d"/></marker>
</defs>

<rect x="0" y="0" width="920" height="160" class="gfill" rx="8"/>
<rect x="0" y="0" width="920" height="160" class="gbox" rx="8"/>
<text x="20" y="30" class="grn" font-size="14" font-weight="600">正版激活</text>

<rect x="20" y="46" width="120" height="44" class="box" rx="6"/>
<text x="80" y="73" class="t" font-size="12" text-anchor="middle">输入 key</text>
<path d="M148,68 L186,68" class="garw"/>
<rect x="194" y="46" width="150" height="44" class="box" rx="6"/>
<text x="269" y="73" class="t" font-size="12" text-anchor="middle">联网询问 Parallels</text>
<path d="M352,68 L390,68" class="garw"/>
<rect x="398" y="46" width="160" height="44" class="box" rx="6"/>
<text x="478" y="73" class="t" font-size="12" text-anchor="middle">服务器返回签名授权</text>
<path d="M566,68 L604,68" class="garw"/>
<rect x="612" y="46" width="130" height="44" class="box" rx="6"/>
<text x="677" y="73" class="t" font-size="12" text-anchor="middle">用原厂公钥验签</text>
<path d="M750,68 L788,68" class="garw"/>
<rect x="796" y="46" width="104" height="44" class="box" rx="6"/>
<text x="848" y="73" class="grn" font-size="12" text-anchor="middle" font-weight="600">解锁</text>

<text x="20" y="122" class="grn" font-size="12" font-weight="600">关键:全程不改动程序的任何一个字节。</text>
<text x="20" y="144" class="t" font-size="12">因此签名保持完整 —— <tspan class="mono">codesign</tspan> 显示 Developer ID,<tspan class="mono">spctl</tspan> 放行。</text>

<rect x="0" y="180" width="920" height="180" class="rfill" rx="8"/>
<rect x="0" y="180" width="920" height="180" class="rbox" rx="8"/>
<text x="20" y="210" class="red" font-size="14" font-weight="600">本次分析的破解</text>

<rect x="20" y="226" width="120" height="44" class="box" rx="6"/>
<text x="80" y="253" class="t" font-size="12" text-anchor="middle">输入 key</text>
<path d="M148,248 L186,248" class="rarw"/>
<rect x="194" y="226" width="150" height="44" class="rbox" rx="6"/>
<text x="269" y="246" class="red" font-size="11" text-anchor="middle" font-weight="600">注入的 dylib 拦截</text>
<text x="269" y="262" class="sub t" font-size="10" text-anchor="middle">从不联网</text>
<path d="M352,248 L390,248" class="rarw"/>
<rect x="398" y="226" width="160" height="44" class="rbox" rx="6"/>
<text x="478" y="246" class="red" font-size="11" text-anchor="middle" font-weight="600">返回本地伪造授权</text>
<text x="478" y="262" class="sub t" font-size="10" text-anchor="middle">licenses.db</text>
<path d="M566,248 L604,248" class="rarw"/>
<rect x="612" y="226" width="130" height="44" class="rbox" rx="6"/>
<text x="677" y="246" class="red" font-size="11" text-anchor="middle" font-weight="600">用破解装的</text>
<text x="677" y="262" class="red" font-size="11" text-anchor="middle" font-weight="600">信任锚验签</text>
<path d="M750,248 L788,248" class="rarw"/>
<rect x="796" y="226" width="104" height="44" class="box" rx="6"/>
<text x="848" y="253" class="t" font-size="12" text-anchor="middle">解锁</text>

<text x="20" y="302" class="red" font-size="12" font-weight="600">代价:必须改动程序二进制 → 必然破坏代码签名 → 只能 adhoc 重签。</text>
<text x="20" y="326" class="t" font-size="12">这条因果链无法回避,它是本次分析中<tspan font-weight="600">所有可观测证据的共同源头</tspan>。</text>
<text x="20" y="348" class="sub t" font-size="11">推论:整套机制里没有任何一环与 Parallels 服务器发生真实交互 —— 所以这不可能是「企业集中授权」。</text>
</svg>
