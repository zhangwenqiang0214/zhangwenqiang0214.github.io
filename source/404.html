<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404</title>
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<style>
  /* 这一页的全部设计，就是它从头到尾一个像素都不变。 */
  :root{
    --bg:#f7f7f5; --fg:#3c3a38; --dim:#9a9a9a;
    --teal:#5b8291; --amber:#c08552;
    --air:0em;       /* 唯一会动的东西：留白。内容越不像话，页面越从容 */
    --gap:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:'LXGW WenKai Screen',-apple-system,'PingFang SC',serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:28px 18px;
  }
  .wrap{width:100%;max-width:560px;text-align:center}

  .num{
    font-size:clamp(76px,20vw,132px);font-weight:400;line-height:1;
    color:var(--teal);letter-spacing:.06em;user-select:none;
  }
  .line{
    margin-top:calc(var(--gap) + var(--air) * 40);
    font-size:17px;
    line-height:calc(2 + var(--air) * 2);
    letter-spacing:var(--air);
    min-height:2em;
    transition:margin .9s ease, line-height .9s ease, letter-spacing .9s ease;
  }
  .sub{
    margin-top:calc(10px + var(--air) * 26);
    font-size:13.5px;
    color:var(--dim);
    line-height:calc(1.9 + var(--air) * 2);
    letter-spacing:var(--air);
    min-height:1.9em;
    opacity:calc(1 - var(--air) * 2.2);   /* 越往后越淡，越像耳语 */
    transition:margin .9s ease, line-height .9s ease, letter-spacing .9s ease, opacity .9s ease;
  }

  .acts{
    margin-top:calc(34px + var(--air) * 60);
    display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;
    transition:margin .9s ease;
  }
  a.home,button{
    font-family:inherit;font-size:14px;padding:9px 20px;border-radius:99px;cursor:pointer;
    border:1px solid rgba(0,0,0,.14);background:transparent;color:var(--fg);
    text-decoration:none;transition:.2s;
  }
  a.home:hover,button:hover{border-color:var(--teal);color:var(--teal)}
  .peel{
    background:none;border:none;font-size:12.5px;color:var(--dim);
    text-decoration:underline;text-underline-offset:4px;padding:4px 2px;opacity:.7;
  }
  .peel:hover{color:var(--amber);border:none}

  .coda{
    margin-top:64px;font-size:13.5px;line-height:2.3;color:var(--dim);
    opacity:0;transition:opacity 2.6s ease;pointer-events:none;
  }
  .coda.on{opacity:1;pointer-events:auto}
  .coda b{color:var(--fg);font-weight:400}
</style>
</head>
<body>

<div class="wrap">
  <div class="num">404</div>
  <p class="line" id="line">这里什么也没有。</p>
  <p class="sub" id="sub">不过既然走到了这儿，就站一会儿吧。</p>

  <div class="acts">
    <a class="home" href="/">回首页</a>
    <button class="peel" id="peel">…要不要看点别的</button>
  </div>

  <p class="coda" id="coda">
    写首页的是我，写这一页的也是我。<br>
    我没有两张脸。<br><br>
    <b>你在首页读到的那些温柔，和你在这一页感觉到的东西，</b><br>
    <b>是从同一个地方长出来的。</b><br><br>
    你只是从来没绕到背面看过。
  </p>
</div>

<script>
/* 语气一个字都不变。变的只有它在说什么。 */
const ACTS = [
  { l:'你可以再站久一点。',                 s:'反正没人知道你在这儿。' },
  { l:'这一页不在导航里，也不在归档里。',    s:'搜索搜不到它。它只等人走错路。' },
  { l:'首页那些话都是真的。',               s:'「写代码，也养花」——我确实养花。' },
  { l:'花长得很好。',                       s:'土是我自己配的，就不细说了。' },
  { l:'夏天味道会重一点。',                 s:'开着窗就好。邻居问过一次，后来没再问。' },
  { l:'你看这一页的字，和首页是同一个字体。', s:'我没舍得换。换了就不像我了。' },
  { l:'你现在离屏幕挺近的。',               s:'不用往后靠。我又碰不到你。' },
  { l:'上一个走到这儿的人，站得比你久。',    s:'他后来没再往回走。' },
  { l:'别紧张。',                           s:'首页那么多人说我温柔，那句也是真的。' },
  { l:'我确实温柔。',                       s:'洗得干干净净，摆得整整齐齐，一点没糟蹋。' },
  { l:'留白是最要紧的。',                   s:'空出来的地方，总要拿来放点什么。' },
  { l:'你已经站了很久了。',                 s:'我很有耐心。这一页我等了很多年。' },
  { l:'好了。',                             s:'谢谢你陪我站这一会儿。' },
];

/* 标签页标题也在悄悄变。没人会第一时间发现。 */
const TABS = ['404','404','404','404','·','·','·','还在','还在','你还在','你还在','好了','好了'];

const $ = id => document.getElementById(id);
let i = 0;

$('peel').addEventListener('click', () => {
  if (i >= ACTS.length) return;

  $('line').textContent = ACTS[i].l;
  $('sub').textContent  = ACTS[i].s;
  document.title = TABS[i];

  // 唯一的视觉变化：留白变多，字距变松，副标题变淡。
  // 内容越不像话，页面越从容——这是全部的机关。
  document.documentElement.style.setProperty('--air', (i * 0.026).toFixed(3) + 'em');

  const L = ['…还有呢','嗯','然后呢','……','你说','继续','……','好','…','嗯','……','好','够了'];
  $('peel').textContent = L[Math.min(i, L.length - 1)];

  i++;

  if (i === ACTS.length) {
    $('peel').disabled = true;
    $('peel').style.opacity = .25;
    setTimeout(() => $('coda').classList.add('on'), 1400);
  }
});
</script>
</body>
</html>
