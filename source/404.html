<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404</title>
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<style>
  /* 这一页的全部设计，就是它从头到尾一个像素都不变。 */
  :root{
    --bg:#f7f7f5; --fg:#3c3a38; --dim:#9a9a9a;
    --teal:#5b8291; --amber:#c08552;
    --air:0em;       /* 唯一会动的东西：留白。内容越不像话，页面越从容 */
    --gap:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:'LXGW WenKai Screen',-apple-system,'PingFang SC',serif;
    /* 用 margin:auto 而不是 align-items:center —— 后者在内容超过视口高度时，
       上方溢出的部分会滚不回去（留白撑开后 404 会被吃掉） */
    display:flex;
    min-height:100vh;padding:28px 18px;
  }
  .wrap{width:100%;max-width:560px;text-align:center;margin:auto}

  .num{
    font-size:clamp(76px,20vw,132px);font-weight:400;line-height:1;
    color:var(--teal);letter-spacing:.06em;user-select:none;
  }
  .line{
    margin-top:calc(var(--gap) + var(--air) * 40);
    font-size:17px;
    line-height:calc(2 + var(--air) * 2);
    letter-spacing:var(--air);
    min-height:2em;
    transition:margin .9s ease, line-height .9s ease, letter-spacing .9s ease;
  }
  .sub{
    margin-top:calc(10px + var(--air) * 26);
    font-size:13.5px;
    color:var(--dim);
    line-height:calc(1.9 + var(--air) * 2);
    letter-spacing:var(--air);
    min-height:1.9em;
    opacity:calc(1 - var(--air) * 2.2);   /* 越往后越淡，越像耳语 */
    transition:margin .9s ease, line-height .9s ease, letter-spacing .9s ease, opacity .9s ease;
  }

  .acts{
    margin-top:calc(34px + var(--air) * 60);
    transition:margin .9s ease;
  }
  /* 没有回首页。这一页不提供出口。 */
  .next{
    font-family:inherit;background:none;border:none;cursor:pointer;
    font-size:13px;color:var(--dim);letter-spacing:.34em;
    padding:6px 10px;opacity:.55;transition:opacity .25s,color .25s;
  }
  .next:hover{opacity:1;color:var(--amber)}
  .next:disabled{opacity:.12;cursor:default}

  .coda{
    margin-top:68px;font-size:13.5px;line-height:2.4;color:var(--dim);
    opacity:0;transition:opacity 3s ease;pointer-events:none;
  }
  .coda.on{opacity:1;pointer-events:auto}
  .coda b{color:var(--fg);font-weight:400}
</style>
</head>
<body>

<div class="wrap">
  <div class="num">404</div>
  <p class="line" id="line">这里什么也没有。</p>
  <p class="sub" id="sub">不过既然走到了这儿，就站一会儿吧。</p>

  <div class="acts">
    <button class="next" id="next">·······</button>
  </div>

  <p class="coda" id="coda">
    写首页的是我。<br>
    写这一页的也是我。<br><br>
    <b>你在首页看到的那个人，就是刚才跟你说话的这个。</b><br><br>
    一直都是。
  </p>
</div>

<script>
/* 全部用最短的陈述句。不用比喻，不用形容词，不提高音量。
   吓人的东西全放在句子之间，不放在句子里。 */

// 用访客自己的钟。没有比"此刻"更具体的东西了。
function now(){
  const d = new Date(), h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  const p = h < 5 ? '凌晨' : h < 11 ? '早上' : h < 13 ? '中午' : h < 18 ? '下午' : '晚上';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return `现在是${p} ${hh} 点 ${m} 分。`;
}

const ACTS = [
  { l:'你可以再站一会儿。',            s:'不着急。' },
  { l:'这一页没有入口。',              s:'你是自己走进来的。' },
  { l:'首页写的都是真的。',            s:'我确实养花。' },
  { l:'花在阳台。一共六盆。',          s:'长得很好。' },
  { l:'土是我自己配的。',              s:'夏天味道会重一点。开窗就行。' },
  { l:'邻居问过一次。',                s:'后来没再问。' },
  { l:'你离屏幕有点近。',              s:'不用往后靠。' },
  { l:'上一个来这一页的人，八月三号。', s:'他待了四十分钟。' },
  { l:'来过的人我都记得。',            s:'不多。' },
  { l:'你今天也来了。',                s:now },
  { l:'我确实温柔。',                  s:'洗得干净，摆得整齐。' },
  { l:'好了。',                        s:'你可以走了。' },
];

/* 标签页标题也在悄悄变。多数人不会第一时间发现。 */
const TABS = ['404','404','404','404','404','·','·','·','·','还在','还在','好了'];

const $ = id => document.getElementById(id);
let i = 0;

$('next').addEventListener('click', () => {
  if (i >= ACTS.length) return;

  const a = ACTS[i];
  $('line').textContent = a.l;
  $('sub').textContent  = typeof a.s === 'function' ? a.s() : a.s;
  document.title = TABS[i];

  // 唯一的视觉变化：留白变多，字距变松，副标题变淡。
  // 内容越不像话，页面越从容——这是全部的机关。
  document.documentElement.style.setProperty('--air', (i * 0.026).toFixed(3) + 'em');

  i++;

  if (i === ACTS.length) {
    $('next').disabled = true;
    setTimeout(() => $('coda').classList.add('on'), 1600);
  }
});
</script>
</body>
</html>
